name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Error "Unformatted Go files:`n$unformatted"
            exit 1
          }

      - name: Run go vet and tests
        shell: pwsh
        run: |
          go vet ./...
          go test -v ./...

      - name: Build Windows GUI binary
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -tags desktop,production -ldflags="-H windowsgui -s -w -X 'main.Version=$version'" -o dist/simple-proxy-gui.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/simple-proxy-gui.exe dist/package/simple-proxy-gui.exe
          Copy-Item LICENSE dist/package/LICENSE
          Compress-Archive -Path dist/package/* -DestinationPath dist/simple-proxy-gui_windows_amd64.zip -Force

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = @("dist/simple-proxy-gui.exe", "dist/simple-proxy-gui_windows_amd64.zip")
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content -Path dist/checksums.txt -Encoding ascii
          Get-Content dist/checksums.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-proxy-gui-windows-amd64
          path: |
            dist/simple-proxy-gui.exe
            dist/simple-proxy-gui_windows_amd64.zip
            dist/checksums.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist/simple-proxy-gui.exe `
            dist/simple-proxy-gui_windows_amd64.zip `
            dist/checksums.txt `
            --title $env:GITHUB_REF_NAME `
            --generate-notes
